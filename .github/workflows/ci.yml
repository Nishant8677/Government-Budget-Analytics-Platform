name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        # Rule set is pinned in ruff.toml so this gate does not change meaning
        # when ruff ships new defaults.
        run: ruff check . --output-format=github

      - name: Test
        # tests/ is deliberately database-free: the suite covers the ETL
        # transform logic, so CI needs no MySQL service container. Collection is
        # scoped in pytest.ini -- scripts/test_constraints.py is a manual
        # database script that matches pytest's discovery pattern without being
        # a test.
        run: pytest
