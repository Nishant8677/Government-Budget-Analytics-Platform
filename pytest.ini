[pytest]
# tests/ holds the real, deterministic suite: it runs without a database.
#
# Collection is scoped because scripts/test_constraints.py matches pytest's
# default discovery (test_*.py) without being a pytest test. Its functions take
# a `cursor` argument rather than a fixture, report with print() rather than
# assertions, and INSERT into the live database. Collected by accident, it
# produced three fixture errors on every run; wired up by accident, it would
# have written to real data.
#
# Plain INI values here -- pytest.ini is not TOML, so ["tests"] would be read as
# a literal directory name rather than a list.
testpaths = tests
addopts = -q
